name: Build KRISP Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: KRISP-KDS-Android-v0.3.1-build3
-packagefix
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build KRISP v0.3.1 APK
        run: gradle :app:assembleDebug

      - name: Upload KRISP APK
        uses: actions/upload-artifact@v4
        with:
          name: KRISP-KDS-0.3.1
          path: KRISP-KDS-Android-v0.3.1-build3-packagefix/app/build/outputs/apk/debug/app-debug.apk
