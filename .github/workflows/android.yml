name: KRISP tested updates
on:
  push:
    branches: [main]
    paths: ['updater/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested APK and make it available in KRISP Settings
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: krisp-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      KRISP_STORE_PASSWORD: ${{ secrets.KRISP_STORE_PASSWORD }}
      KRISP_KEY_PASSWORD: ${{ secrets.KRISP_KEY_PASSWORD }}
      KRISP_KEYSTORE: ${{ github.workspace }}/signing.p12
      KRISP_BASELINE: ${{ github.workspace }}/baseline.apk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Fetch immutable Build 4 baseline
        run: curl --fail --location --retry 3 'https://github.com/jimmowrey-creator/KRISP-KDS/releases/download/v0.3.1/KRISP-KDS-0.3.1-Build4.apk' --output baseline.apk
      - name: Load signing key privately
        env:
          KRISP_SIGNING_KEY: ${{ secrets.KRISP_SIGNING_KEY }}
        run: |
          python - <<'PY'
          import os,base64,pathlib
          value=os.environ['KRISP_SIGNING_KEY']
          assert value and os.environ['KRISP_STORE_PASSWORD'] and os.environ['KRISP_KEY_PASSWORD'], 'Configure the three KRISP signing secrets first'
          p=pathlib.Path(os.environ['KRISP_KEYSTORE'])
          p.write_bytes(base64.b64decode(value));p.chmod(0o600)
          PY
      - name: Build signed APK and run regression checks
        run: python updater/tools/build.py --baseline "$KRISP_BASELINE" --sdk "$ANDROID_HOME" --java "$JAVA_HOME" --keystore "$KRISP_KEYSTORE"
      - name: Prepare isolated update-install test
        run: python updater/tools/prepare-smoke.py
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android update and relaunch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: python updater/tools/smoke.py
      - name: Save tested APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KRISP-tested-build
          path: updater/dist/
      - name: Publish approved build
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python updater/tools/publish.py
      - name: Remove runner signing material
        if: always()
        run: rm -f "$KRISP_KEYSTORE"
